[project]
name = "printagent"
version = "0.1.0"
description = "MCP server that lets AI assistants order print: find, quote, preflight, auto-fix, draft order."
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=1.10,<2",
  "pillow>=10.1",
  "pymupdf>=1.24",
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
printagent = "printagent.server:main"
printagent-web = "printagent.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["printagent"]

[tool.setuptools.package-data]
printagent = ["static/*"]
